<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İBRAAM'IN OYUNU - GLOW ARENA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Press+Start+2P&display=swap');
        
        :root {
            --blue: #00f3ff;
            --pink: #ff00ff;
            --bg: #020205;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; }

        /* ANA MENÜ TASARIMI */
        #menu-overlay {
            position: absolute; z-index: 1000; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0a20 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #menu-card {
            background: rgba(10, 10, 20, 0.9);
            padding: 50px; border-radius: 40px; border: 3px solid var(--blue);
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.4); text-align: center; width: 380px;
        }

        h1 { font-family: 'Press Start 2P', cursive; font-size: 18px; line-height: 1.6; color: var(--blue); text-shadow: 0 0 20px var(--blue); margin-bottom: 30px; }
        .game-subtitle { font-size: 12px; color: var(--pink); letter-spacing: 5px; margin-bottom: 20px; }

        input {
            width: 100%; padding: 18px; background: #000; border: 2px solid #333;
            color: var(--blue); font-size: 22px; text-align: center; margin-bottom: 20px;
            border-radius: 15px; font-family: 'Orbitron'; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--pink); box-shadow: 0 0 15px var(--pink); }

        .btn-container { display: flex; gap: 15px; }
        button {
            flex: 1; padding: 18px; border: none; border-radius: 15px;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
            transition: 0.3s; font-family: 'Orbitron'; font-size: 14px;
        }
        .host-btn { background: var(--blue); color: #000; }
        .join-btn { background: var(--pink); color: #fff; }
        button:hover { transform: translateY(-5px); filter: brightness(1.2); }

        /* OYUN SAHASI */
        #arena-container { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }

        #score-board {
            position: absolute; width: 100%; height: 100%; display: flex;
            flex-direction: column; justify-content: space-around;
            pointer-events: none; align-items: center; z-index: 1;
        }
        .score-num { font-size: 140px; font-weight: 900; opacity: 0.1; }

        #goal-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: 900; color: white; display: none;
            text-shadow: 0 0 40px #fff; z-index: 2000; font-family: 'Press Start 2P';
        }

        #connection-info { position: absolute; bottom: 20px; font-size: 10px; color: #444; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div id="menu-card">
            <div class="game-subtitle">PRO ARENA</div>
            <h1>İBRAAM'IN<br>OYUNU</h1>
            <input type="text" id="room-code" placeholder="4 HANELİ ŞİFRE" maxlength="4">
            <div class="btn-container">
                <button class="host-btn" onclick="initGame('host')">ODA KUR</button>
                <button class="join-btn" onclick="initGame('join')">KATIL</button>
            </div>
            <p id="status-msg" style="color: #666; margin-top: 20px; font-size: 11px;">Şifreyi gir ve arkadaşını bekle.</p>
        </div>
    </div>

    <div id="goal-popup">GOAL!</div>

    <div id="arena-container">
        <div id="score-board">
            <div class="score-num" id="s1-display" style="color:var(--blue)">0</div>
            <div class="score-num" id="s2-display" style="color:var(--pink)">0</div>
        </div>
        <canvas id="mainCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const goalPopup = document.getElementById('goal-popup');
        
        let peer, conn, role;
        let isMoving = false;
        let goalAnimation = false;

        const config = {
            paddleR: 45,
            puckR: 25,
            goalSize: 200, // Kale genişliği
            friction: 0.985,
            maxSpeed: 20
        };

        const state = {
            p1: { x: 0, y: 0, score: 0 },
            p2: { x: 0, y: 0, score: 0 },
            puck: { x: 0, y: 0, vx: 0, vy: 0 },
            screen: { w: 0, h: 0 }
        };

        function initGame(type) {
            const code = document.getElementById('room-code').value;
            if (code.length < 4) return alert("4 Haneli şifre şart kanka!");

            role = type;
            const peerId = role === 'host' ? `ibraam-${code}-h` : `ibraam-${code}-j`;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                if(role === 'host') {
                    document.getElementById('status-msg').innerText = "Oda kuruldu, arkadaşını bekle...";
                } else {
                    document.getElementById('status-msg').innerText = "Bağlanılıyor...";
                    conn = peer.connect(`ibraam-${code}-h`);
                    handleConnection();
                }
            });

            peer.on('connection', (c) => {
                conn = c;
                handleConnection();
            });

            peer.on('error', () => alert("Bağlantı hatası! Şifreyi kontrol et veya interneti yenile."));
        }

        function handleConnection() {
            conn.on('open', () => {
                document.getElementById('menu-overlay').style.display = 'none';
                document.getElementById('arena-container').style.display = 'block';
                setupLayout();
                animate();
            });

            conn.on('data', (data) => {
                if (role === 'host') {
                    state.p2.x = data.x;
                    state.p2.y = data.y;
                } else {
                    state.p1 = data.p1;
                    state.puck = data.puck;
                    state.p1.score = data.s1;
                    state.p2.score = data.s2;
                    if(data.goal) showGoal();
                }
            });
        }

        function setupLayout() {
            state.screen.w = canvas.width = window.innerWidth;
            state.screen.h = canvas.height = window.innerHeight;
            
            state.p1.x = state.screen.w / 2;
            state.p1.y = 120;
            state.p2.x = state.screen.w / 2;
            state.p2.y = state.screen.h - 120;
            
            resetPuck();
        }

        function resetPuck() {
            state.puck.x = state.screen.w / 2;
            state.puck.y = state.screen.h / 2;
            state.puck.vx = 0;
            state.puck.vy = 0;
        }

        function showGoal() {
            if(goalAnimation) return;
            goalAnimation = true;
            goalPopup.style.display = 'block';
            setTimeout(() => {
                goalPopup.style.display = 'none';
                goalAnimation = false;
            }, 1500);
        }

        // KONTROLLER
        const inputStart = () => isMoving = true;
        const inputEnd = () => isMoving = false;
        const inputMove = (e) => {
            if(!isMoving) return;
            const pointer = e.touches ? e.touches[0] : e;
            const rect = canvas.getBoundingClientRect();
            const curX = pointer.clientX - rect.left;
            const curY = pointer.clientY - rect.top;

            if (role === 'host') {
                state.p1.x = curX;
                state.p1.y = Math.min(curY, state.screen.h / 2 - config.paddleR);
            } else {
                state.p2.x = curX;
                state.p2.y = Math.max(curY, state.screen.h / 2 + config.paddleR);
            }
        };

        window.addEventListener('mousedown', inputStart);
        window.addEventListener('touchstart', inputStart);
        window.addEventListener('mouseup', inputEnd);
        window.addEventListener('touchend', inputEnd);
        window.addEventListener('mousemove', inputMove);
        window.addEventListener('touchmove', inputMove);

        // FİZİK MOTORU
        function updatePhysics() {
            if (role !== 'host') return;

            state.puck.x += state.puck.vx;
            state.puck.y += state.puck.vy;
            state.puck.vx *= config.friction;
            state.puck.vy *= config.friction;

            // Yan Duvarlar
            if (state.puck.x < config.puckR || state.puck.x > state.screen.w - config.puckR) {
                state.puck.vx *= -1;
                state.puck.x = state.puck.x < config.puckR ? config.puckR : state.screen.w - config.puckR;
            }

            // Kaleler ve Üst/Alt Duvarlar
            const inGoalRange = state.puck.x > (state.screen.w / 2 - config.goalSize / 2) && 
                               state.puck.x < (state.screen.w / 2 + config.goalSize / 2);

            if (state.puck.y < config.puckR) {
                if (inGoalRange) {
                    state.p2.score++;
                    resetPuck();
                    showGoal();
                    conn.send({ goal: true });
                } else {
                    state.puck.vy *= -1;
                    state.puck.y = config.puckR;
                }
            }

            if (state.puck.y > state.screen.h - config.puckR) {
                if (inGoalRange) {
                    state.p1.score++;
                    resetPuck();
                    showGoal();
                    conn.send({ goal: true });
                } else {
                    state.puck.vy *= -1;
                    state.puck.y = state.screen.h - config.puckR;
                }
            }

            // Raket Çarpışmaları
            resolveCollision(state.puck, state.p1);
            resolveCollision(state.puck, state.p2);

            // Veri Gönder
            conn.send({ 
                p1: state.p1, 
                puck: state.puck, 
                s1: state.p1.score, 
                s2: state.p2.score 
            });
        }

        function resolveCollision(puck, paddle) {
            const dx = puck.x - paddle.x;
            const dy = puck.y - paddle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = config.puckR + config.paddleR;

            if (distance < minDistance) {
                const angle = Math.atan2(dy, dx);
                const targetX = paddle.x + Math.cos(angle) * minDistance;
                const targetY = paddle.y + Math.sin(angle) * minDistance;
                
                // Vuruş hızı
                const speed = 18;
                puck.vx = Math.cos(angle) * speed;
                puck.vy = Math.sin(angle) * speed;
                
                puck.x = targetX;
                puck.y = targetY;
            }
        }

        // GÖRSEL ÇİZİM
        function drawArena() {
            ctx.clearRect(0, 0, state.screen.w, state.screen.h);

            // Orta Çizgi ve Daire
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, state.screen.h / 2); ctx.lineTo(state.screen.w, state.screen.h / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(state.screen.w / 2, state.screen.h / 2, 80, 0, Math.PI * 2);
            ctx.stroke();

            // NEON KALELER
            const gx = state.screen.w / 2 - config.goalSize / 2;
            
            // Üst Kale (Mavi)
            ctx.shadowBlur = 20; ctx.shadowColor = varColor('--blue');
            ctx.fillStyle = varColor('--blue');
            ctx.fillRect(gx, 0, config.goalSize, 10);
            
            // Alt Kale (Pembe)
            ctx.shadowBlur = 20; ctx.shadowColor = varColor('--pink');
            ctx.fillStyle = varColor('--pink');
            ctx.fillRect(gx, state.screen.h - 10, config.goalSize, 10);
            ctx.shadowBlur = 0;

            // Skorlar
            document.getElementById('s1-display').innerText = state.p1.score;
            document.getElementById('s2-display').innerText = state.p2.score;

            // Nesneler
            drawEntity(state.p1.x, state.p1.y, config.paddleR, varColor('--blue'), true);
            drawEntity(state.p2.x, state.p2.y, config.paddleR, varColor('--pink'), true);
            drawEntity(state.puck.x, state.puck.y, config.puckR, "#fff", false);
        }

        function drawEntity(x, y, r, color, isStriker) {
            ctx.shadowBlur = 25; ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            
            if(isStriker) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

        function animate() {
            updatePhysics();
            if (role !== 'host') {
                conn.send({ x: state.p2.x, y: state.p2.y });
            }
            drawArena();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', setupLayout);
    </script>
</body>
</html>
