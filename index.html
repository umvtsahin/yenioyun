<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOW HOCKEY PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        :root { --blue: #00f3ff; --pink: #ff00ff; --bg: #050505; }
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        #menu { 
            position: absolute; z-index: 100; background: rgba(10,10,15,0.95); padding: 30px; 
            border: 2px solid var(--blue); border-radius: 20px; text-align: center; width: 320px;
        }
        input { 
            width: 100%; padding: 12px; margin: 15px 0; background: #111; border: 1px solid #333; 
            color: var(--blue); font-size: 18px; text-align: center; border-radius: 8px; outline: none;
        }
        .btns { display: flex; gap: 10px; }
        button { 
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        .b-h { background: var(--blue); } .b-j { background: var(--pink); color: white; }
        
        #game-ui { 
            position: absolute; top: 0; width: 100%; height: 100%; display: none; pointer-events: none;
            border: 5px solid #111;
        }
        .score { position: absolute; font-size: 60px; opacity: 0.3; width: 100%; text-align: center; }
        .goal { position: absolute; height: 150px; width: 10px; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="menu">
        <h2 style="color:var(--blue)">GLOW HOCKEY</h2>
        <input type="text" id="code" placeholder="4 HANELİ ŞİFRE" maxlength="4">
        <div class="btns">
            <button class="b-h" onclick="start('host')">KUR</button>
            <button class="b-j" onclick="start('join')">KATIL</button>
        </div>
        <p id="msg" style="font-size:10px; margin-top:15px; color:#555">Aynı şifreyi girip farklı butonlara basın.</p>
    </div>

    <div id="game-ui">
        <div class="score" id="s1_ui" style="top: 10%; color:var(--blue)">0</div>
        <div class="score" id="s2_ui" style="bottom: 10%; color:var(--pink)">0</div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let peer, conn, role;
        let s1 = 0, s2 = 0;

        const world = { w: 0, h: 0 };
        const puck = { x: 0, y: 0, vx: 0, vy: 0, r: 25 };
        const p1 = { x: 0, y: 0, r: 40, color: '#00f3ff' };
        const p2 = { x: 0, y: 0, r: 40, color: '#ff00ff' };

        function start(type) {
            const val = document.getElementById('code').value;
            if(val.length < 4) return;
            role = type;
            const id = type === 'host' ? `glow-${val}-h` : `glow-${val}-j`;
            peer = new Peer(id);
            
            peer.on('open', () => {
                if(role === 'join') {
                    conn = peer.connect(`glow-${val}-h`);
                    initComm();
                }
                document.getElementById('msg').innerText = "Bağlantı bekleniyor...";
            });

            peer.on('connection', c => {
                conn = c;
                initComm();
            });
        }

        function initComm() {
            conn.on('open', () => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                setup();
                loop();
            });
            conn.on('data', data => {
                if(role === 'host') {
                    p2.x = data.x; p2.y = data.y;
                } else {
                    p1.x = data.p1.x; p1.y = data.p1.y;
                    puck.x = data.puck.x; puck.y = data.puck.y;
                    s1 = data.s1; s2 = data.s2;
                }
            });
        }

        function setup() {
            world.w = canvas.width = window.innerWidth;
            world.h = canvas.height = window.innerHeight;
            puck.x = world.w/2; puck.y = world.h/2;
            p1.x = world.w/2; p1.y = 100;
            p2.x = world.w/2; p2.y = world.h - 100;
        }

        window.onmousemove = window.ontouchmove = e => {
            const pos = e.touches ? e.touches[0] : e;
            if(role === 'host') { p1.x = pos.clientX; p1.y = pos.clientY; }
            else { p2.x = pos.clientX; p2.y = pos.clientY; }
        };

        function checkCircleCol(c1, c2) {
            const dx = c1.x - c2.x;
            const dy = c1.y - c2.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < c1.r + c2.r) {
                const angle = Math.atan2(dy, dx);
                puck.vx = Math.cos(angle) * 12;
                puck.vy = Math.sin(angle) * 12;
            }
        }

        function loop() {
            ctx.fillStyle = 'rgba(5,5,5,0.4)';
            ctx.fillRect(0,0,world.w, world.h);

            if(role === 'host') {
                // Fizik
                puck.x += puck.vx; puck.y += puck.vy;
                puck.vx *= 0.98; puck.vy *= 0.98; // Sürtünme

                // Duvarlar
                if(puck.x < puck.r || puck.x > world.w - puck.r) puck.vx *= -1;
                
                // Kale Kontrol (Üst ve Alt)
                if(puck.y < 0) { s2++; resetPuck(); }
                if(puck.y > world.h) { s1++; resetPuck(); }
                if(puck.y < puck.r || puck.y > world.h - puck.r) puck.vy *= -1;

                checkCircleCol(puck, p1);
                checkCircleCol(puck, p2);

                conn.send({ p1, puck, s1, s2 });
            } else {
                conn.send({ x: p2.x, y: p2.y });
            }

            // Skor Güncelle
            document.getElementById('s1_ui').innerText = s1;
            document.getElementById('s2_ui').innerText = s2;

            // Çizim
            drawCircle(p1.x, p1.y, p1.r, p1.color);
            drawCircle(p2.x, p2.y, p2.r, p2.color);
            drawCircle(puck.x, puck.y, puck.r, '#fff', true);

            requestAnimationFrame(loop);
        }

        function resetPuck() {
            puck.x = world.w/2; puck.y = world.h/2;
            puck.vx = 0; puck.vy = 0;
        }

        function drawCircle(x, y, r, color, isPuck = false) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI*2);
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.stroke();
            if(isPuck) { ctx.fillStyle = "white"; ctx.fill(); }
            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>
